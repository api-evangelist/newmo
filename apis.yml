aid: newmo
name: newmo
description: 'newmo (newmo株式会社, "ニューモ") is a Japanese mobility company with the mission
  "移動で地域をカラフルに" — coloring regions through movement. It modernizes regional transportation
  through a consumer ride-hailing app and taxi service (newmo-taxi.jp), driver recruitment
  and dispatch, and its newmo Autonomy initiative (newmo.ai), which since 2025 has run
  Level 4 autonomous-driving taxi trials spanning safety, remote monitoring, operations
  design, and vehicle integration. newmo is a consumer transportation service rather than
  a developer/API platform; probing found no public API, developer portal, documentation,
  or well-known discovery surface. Backed by DCM Ventures.'
